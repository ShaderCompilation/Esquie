[package]
name = "esquie"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
exclude = [".private/", "AGENTS.md"]

[dependencies]
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
pipewire = { version = "0.10", features = ["v1_0_0"] }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-18",
    "backend-winit-wayland",
    "backend-winit-x11",
    "renderer-femtovg",
    "renderer-software",
    "software-renderer-path",
    "accessibility",
] }
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "async-std",
] }
anyhow = "1"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
resvg = "0.48"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
] }
tracing-appender = "0.2"

[dev-dependencies]
# Match the locked Slint version: its test API follows the internal ABI.
i-slint-backend-testing = "=1.18.1"
# Already used by ksni; the tray test fakes a StatusNotifierWatcher with it.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[build-dependencies]
slint-build = "1.18"
