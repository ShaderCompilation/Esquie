name: Tagged release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appimage-build:
    name: Build release candidate / x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag matches Cargo version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [[ $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Resolve base image digest
        id: image
        run: |
          mkdir -p "$RUNNER_TEMP/esquie-cache/cargo" "$RUNNER_TEMP/esquie-cache/rustup"
          docker pull --platform linux/amd64 ubuntu:24.04
          echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' ubuntu:24.04)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/esquie-cache/cargo
          key: cargo-downloads-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-
      - name: Restore pinned Rust toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/esquie-cache/rustup
          key: rust-toolchain-${{ hashFiles('rust-toolchain.toml') }}
      - name: Restore AppImage build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/appimage-build
          key: appimage-build-${{ steps.image.outputs.digest }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            appimage-build-${{ steps.image.outputs.digest }}-
      - name: Restore pinned cargo-about
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/license-tools
          key: cargo-about-0.9.3
      - name: Build on the oldest supported baseline and inspect payload
        env:
          CONTAINER_ENGINE: docker
          CARGO_BUILD_JOBS: 4
          esquie_cargo_cache: ${{ runner.temp }}/esquie-cache/cargo
          esquie_rustup_cache: ${{ runner.temp }}/esquie-cache/rustup
        run: bash packaging/appimage/build.sh
      - name: Upload candidate and checksums for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-candidate-x86_64
          path: |
            target/appimage/*.AppImage
            target/appimage/*.AppImage.sha256
          if-no-files-found: error
      - name: Upload packaging evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-build-evidence
          path: target/appimage/evidence/
          if-no-files-found: error

  appimage-test:
    name: Candidate runtime / ${{ matrix.image }}
    needs: appimage-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "archlinux:base"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage-candidate-x86_64
          path: target/appimage/
      - name: Verify checksum and exercise extracted payload without FUSE
        env:
          CONTAINER_ENGINE: docker
          DISTRO_IMAGE: ${{ matrix.image }}
        run: bash packaging/appimage/test.sh "$DISTRO_IMAGE"
      - name: Name validation evidence
        if: always()
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: echo "EVIDENCE_ID=${DISTRO_IMAGE//[:\/]/-}" >> "$GITHUB_ENV"
      - name: Upload candidate runtime evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-runtime-${{ env.EVIDENCE_ID }}
          path: target/appimage/test/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [appimage-build, appimage-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: packaging/release/esquie.pub
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage-candidate-x86_64
          path: target/appimage/
      - name: Verify candidate checksum before publishing
        run: |
          cd target/appimage
          sha256sum --check ./*.sha256
      # A draft stays out of /releases/latest. The maintainer signs the checksum
      # offline with packaging/release/sign.sh, which then publishes it.
      - name: Create draft release with AppImage and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          appimage="Esquie-${version}-x86_64.AppImage"
          checksum="$(sha256sum "target/appimage/${appimage}" | cut -d' ' -f1)"
          public_key="$(sed -n 2p packaging/release/esquie.pub)"
          cat > target/release-notes.md <<EOF
          Esquie ${version} for Linux x86_64.

          ## Download

          - \`${appimage}\` — the application
          - \`${appimage}.sha256\` — SHA-256 checksum
          - \`${appimage}.sha256.minisig\` — [minisign](https://jedisct1.github.io/minisign/) signature of the checksum

          ## Verify and run

          \`\`\`sh
          minisign -Vm ${appimage}.sha256 -P ${public_key}
          sha256sum --check ${appimage}.sha256
          chmod +x ${appimage}
          ./${appimage}
          \`\`\`

          SHA-256: \`${checksum}\`

          ## Prerequisites

          x86_64, glibc 2.39+, PipeWire 1.0+, and Wayland or X11. Host
          prerequisites and instructions are in
          [docs/appimage.md](https://github.com/ShaderCompilation/Esquie/blob/${TAG}/docs/appimage.md).

          ## Source and licenses

          Esquie is GPL-3.0-only. The complete corresponding source for this
          binary is the [${TAG} tag](https://github.com/ShaderCompilation/Esquie/tree/${TAG})
          of this repository. Embedded third-party components retain their own
          licenses; see THIRD_PARTY_NOTICES.md in the source tree.
          EOF
          gh release create "$TAG" \
            "target/appimage/${appimage}" \
            "target/appimage/${appimage}.sha256" \
            --draft \
            --title "Esquie ${version}" \
            --notes-file target/release-notes.md
